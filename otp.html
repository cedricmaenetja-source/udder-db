<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Udder Database - Verification</title>
  <link rel="stylesheet" href="assets/css/styles.css" />
  <link rel="stylesheet" href="assets/css/login.css" />
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script type="module" src="assets/js/core/auth/otp.js"></script>
  <style>
    .login-box label {
        width: 100%;
        font-size: 13px;
        font-weight: 600;
        color: #444;
        text-align: left;
        margin-bottom: -8px;
    }
    .loader-wrapper {
        position: fixed;
        inset: 0;
        background: white;
        z-index: 9999;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .loader {
        width: 48px;
        height: 48px;
        border: 5px solid #000;
        border-bottom-color: transparent;
        border-radius: 50%;
        display: inline-block;
        box-sizing: border-box;
        animation: rotation 1s linear infinite;
    }

    @keyframes rotation {
        0% {
            transform: rotate(0deg);
        }
        100% {
            transform: rotate(360deg);
        }
    }
    .hide{
      display: none !important;
    }
    button{
      background: #000 !important;
      color: white !important;
    }
  </style>
</head>
<body>
  <div class="screen">
    <div class="brand">
      <div class="float-left">
          <a href="./" style="text-decoration: none;"><span style="font-size: 30px;color: var(--black);"><strong>UDDER</strong></span><br/><span style="color: grey;font-size: 21px;">DATABASE</span></a>
        </div>
    </div>

    <div class="cow-icon">
        <img src="assets/images/cow.png" alt="Cow illustration">
    </div>
    <div class="loader-wrapper">
        <span class="loader"></span>
    </div>
    <div class="login-box hide">
        <span>We sent a verification code to <span id="email"></span>. Enter the OTP below to continue.</span>
        <!-- <label for="otp">OTP Code</label> -->
        <div class="otp-group" style="margin-top: 20px;">
            <input type="text" maxlength="1">
            <input type="text" maxlength="1">
            <input type="text" maxlength="1">
            <input type="text" maxlength="1">
        </div>
      <button class="cta" id="verifyBtn">Verify</button>
      <span style="color: var(--grey);font-size: 12px;margin-top: 20px;">
        Didn't receive it?
        <a href="javascript:void(0)" class="" id="resendBtn">Re-send</a>
      </span>
    </div>
  </div>
</body>
</html>
