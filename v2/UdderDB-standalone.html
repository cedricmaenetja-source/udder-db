  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

 font-style: normal;\n  font-weight: 900;\n  font-display: swap;\n  src: url(\"5620a07c-e81c-48e3-96ce-d210007f9996\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n:root {\n  /* ========================================================\n     COLOR — BRAND\n     ======================================================== */\n  --udder-orange:        #F15025;  /* signature brand orange. THE color. */\n  --udder-orange-ink:    #D03E14;  /* pressed / darker hover state */\n  --udder-orange-tint:   #FDEBE4;  /* soft tint for backgrounds */\n\n  --udder-black:         #000000;  /* wordmark, headings, UI text */\n  --udder-ink:           #1F1F1F;  /* near-black body text on light bg */\n  --udder-white:         #FFFFFF;\n\n  /* supporting neutrals pulled from decks */\n  --udder-slate-900:     #111111;\n  --udder-slate-700:     #3D3D3D;\n  --udder-slate-500:     #595959;\n  --udder-slate-400:     #9E9E9E;\n  --udder-slate-200:     #EEEEEE;\n  --udder-slate-100:     #F3F3F3;\n  --udder-cream:         #FFFAF2;  /* off-white panel bg */\n\n  /* accent — used sparingly, mostly for data / highlights in all-hands */\n  --udder-green:         #158158;  /* positive / growth */\n  --udder-green-soft:    #6AA84F;\n  --udder-red:           #CC2222;  /* regression / risk */\n  --udder-blue-link:     #1155CC;\n\n  /* ========================================================\n     COLOR — SEMANTIC\n     ======================================================== */\n  --bg:                  var(--udder-white);\n  --bg-alt:              var(--udder-slate-100);\n  --bg-inverse:          var(--udder-black);\n  --bg-brand:            var(--udder-orange);\n\n  --fg1:                 var(--udder-black);      /* primary text */\n  --fg2:                 var(--udder-slate-700);  /* secondary text */\n  --fg3:                 var(--udde 02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* devanagari */\n@font-face {\n  font-family: 'Poppins';\n  font-style: normal;\n  font-weight: 900;\n  font-display: swap;\n  src: url(\"5c529c07-c1d3-4ffe-a9c9-4a7bac4bd2a9\") format('woff2');\n  unicode-range: U+0900-097F, U+1CD0-1CF9, U+200C-200D, U+20A8, U+20B9, U+20F0, U+25CC, U+A830-A839, U+A8E0-A8FF, U+11B00-11B09;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Poppins';\n  font-style: normal;\n  font-weight: 900;\n  font-display: swap;\n  src: url(\"294d2c92-fa5b-48a0-8ed5-0f1b91097653\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Poppins';\n  font-style: normal;\n  font-weight: 900;\n  font-display: swap;\n  src: url(\"5620a07c-e81c-48e3-96ce-d210007f9996\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n:root {\n  /* ========================================================\n     COLOR — BRAND\n     ======================================================== */\n  --udder-orange:        #F15025;  /* signature brand orange. THE color. */\n  --udder-orange-ink:    #D03E14;  /* pressed / darker hover state */\n  --udder-orange-tint:   #FDEBE4;  /* soft tint for backgrounds */\n\n  --udder-black:         #000000;  /* wordmark, headings, UI text */\n  --udder-ink:           #1F1F1F;  /* near-black body text on light bg */\n  --udder-white:         #FFFFFF;\n\n  /* supporting neutrals pulled from decks */\n  --udder-slate-900:     #111111;\n  --udder-slate-700:     #3D3D3D;\n  --udder-slate-500:     #595959;\n  --udder-slate-400:     #9E9E9E;\n  --udder-slate-200:     #EEEEEE;\n  --udder-slate-100:     #F3F3F3;\n  --udder-cream:         #FFFAF2;  /* off-white panel bg */\n\n  /* accent — used sparingly, mostly for data / highlights in all-hands */\n  --udder-green:         #158158;  /* positive / growth */\n  --udder-green-soft:    #6AA84F;\n  --udder-red:           #CC2222;  /* regression / risk */\n  --udder-blue-link:     #1155CC;\n\n  /* ========================================================\n     COLOR — SEMANTIC\n     ======================================================== */\n  --bg:                  var(--udder-white);\n  --bg-alt:              var(--udder-slate-100);\n  --bg-inverse:          var(--udder-black);\n  --bg-brand:            var(--udder-orange);\n\n  --fg1:                 var(--udder-black);      /* primary text */\n  --fg2:                 var(--udder-slate-700);  /* secondary text */\n  --fg3:                 var(--udder-slate-500);  /* muted / captions */\n  --fg-on-brand:         var(--udder-white);      /* text on orange */\n  --fg-on-dark:          var(--udder-white);\n\n  --border:              var(--udder-slate-200);\n  --border-strong:       var(--udder-black);\n\n  --accent:              var(--udder-orange);\n  --accent-ink:          var(--udder-orange-ink);\n  --link:                var(--udder-blue-link);\n\n  /* ========================================================\n     TYPE — FAMILIES\n     ======================================================== */\n  --font-display:  'Poppins', 'Helvetica Neue', Arial, sans-serif;\n  --font-body:     'Inter', 'Helvetica Neue', Arial, sans-serif;\n  --font-alt:      'Poppins', 'Helvetica Neue', Arial, sans-serif;\n  --font-mono:     ui-monospace, 'SF Mono', Menlo, monospace;\n\n  /* ========================================================\n     TYPE — WEIGHTS\n     ======================================================== */\n  --w-regular: 400;\n  --w-medium:  500;\n  --w-semibold:600;\n  --w-bold:    700;\n  --w-extrabold: 800;\n  --w-black:   900;\n\n  /* ========================================================\n     TYPE — SCALE (deck-first; 1920×1080)\n     ======================================================== */\n  --fs-hero:      128px; /* title slide wordmarks */\n  --fs-display:   88px;\n  --fs-h1:        64px;\n  --fs-h2:        48px;\n  --fs-h3:        36px;\n  --fs-h4:        28px;\n  --fs-body-lg:   22px;\n  --fs-body:      18px;\n  --fs-caption:   14px;\n  --fs-micro:     11px;\n\n  /* ========================================================\n     SPACING (8pt grid)\n     ======================================================== */\n  --sp-1:  4px;\n  --sp-2:  8px;\n  --sp-3:  12px;\n  --sp-4:  16px;\n  --sp-5:  24px;\n  --sp-6:  32px;\n  --sp-7:  48px;\n  --sp-8:  64px;\n  --sp-9:  96px;\n  --sp-10: 128px;\n\n  /* ========================================================\n     RADII — Udder is SHARP. Square corners are the default.\n     ======================================================== */\n  --r-0: 0;        /* default — sharp */\n  --r-1: 2px;\n  --r-2: 4px;\n  --r-3: 8px;      /* cards (rare) */\n  --r-pill: 999px; /* capsule tags */\n\n  /* ========================================================\n     ELEVATION — minimal, rarely used\n     ======================================================== */\n  --shadow-1: 0 1px 2px rgba(0,0,0,.06);\n  --shadow-2: 0 4px 12px rgba(0,0,0,.08);\n  --shadow-3: 0 12px 32px rgba(0,0,0,.12);\n\n  /* ========================================================\n     MOTION\n     ======================================================== */\n  --ease-out: cubic-bezier(.2,.7,.2,1);\n  --ease-std: cubic-bezier(.4,0,.2,1);\n  --dur-fast:   120ms;\n  --dur-normal: 200ms;\n  --dur-slow:   360ms;\n}\n\n/* ============================================================\n   SEMANTIC TYPE CLASSES\n   Use these over raw font-size where possible.\n   ============================================================ */\n\n.u-display {\n  font-family: var(--font-display);\n  font-weight: var(--w-black);\n  font-size: var(--fs-display);\n  line-height: .92;\n  letter-spacing: -0.02em;\n  color: var(--fg1);\n  text-transform: uppercase;\n}\n\n.u-h1 {\n  font-family: var(--font-display);\n  font-weight: var(--w-extrabold);\n  font-size: var(--fs-h1);\n  line-height: 1.02;\n  letter-spacing: -0.015em;\n  color: var(--fg1);\n}\n\n.u-h2 {\n  font-family: var(--font-display);\n  font-weight: var(--w-bold);\n  font-size: var(--fs-h2);\n  line-height: 1.05;\n  letter-spacing: -0.01em;\n  color: var(--fg1);\n}\n\n.u-h3 {\n  font-family: var(--font-display);\n  font-weight: var(--w-semibold);\n  font-size: var(--fs-h3);\n  line-height: 1.1;\n  color: var(--fg1);\n}\n\n.u-h4 {\n  font-family: var(--font-display);\n  font-weight: var(--w-semibold);\n  font-size: var(--fs-h4);\n  line-height: 1.2;\n  color: var(--fg1);\n}\n\n.u-eyebrow {\n  font-family: var(--font-display);\n  font-weight: var(--w-bold);\n  font-size: var(--fs-caption);\n  letter-spacing: 0.18em;\n  text-transform: uppercase;\n  color: var(--accent);\n}\n\n.u-body-lg {\n  font-family: var(--font-body);\n  font-weight: var(--w-regular);\n  font-size: var(--fs-body-lg);\n  line-height: 1.45;\n  color: var(--fg1);\n}\n\n.u-body {\n  font-family: var(--font-body);\n  font-weight: var(--w-regular);\n  font-size: var(--fs-body);\n  line-height: 1.5;\n  color: var(--fg1);\n}\n\n.u-caption {\n  font-family: var(--font-body);\n  font-weight: var(--w-regular);\n  font-size: var(--fs-caption);\n  line-height: 1.4;\n  color: var(--fg3);\n}\n\n.u-lede {\n  font-family: var(--font-body);\n  font-weight: var(--w-semibold);\n  font-size: var(--fs-body-lg);\n  line-height: 1.4;\n  color: var(--fg2);\n}\n\n.u-number {\n  font-family: var(--font-display);\n  font-weight: var(--w-black);\n  font-variant-numeric: tabular-nums;\n  letter-spacing: -0.02em;\n  color: var(--accent);\n}\n\n\n/* ============================================================\n   WEB-BRAND TUNING (udder.rocks)\n   Poppins is more rounded than League Spartan — soften corners\n   globally to match the web aesthetic, keep the orange punch.\n   ============================================================ */\n:root {\n  --r-soft: 6px;      /* web-native softening for cards & inputs */\n  --r-card: 12px;\n  --r-btn: 999px;     /* udder.rocks uses pill buttons */\n}\n/* Buttons: pill-shape, like udder.rocks */\n.btn { border-radius: var(--r-btn) !important; font-family: var(--font-body); font-weight: 600; letter-spacing: 0; text-transform: none; }\n.btn-primary { background: var(--accent); color: var(--fg-on-brand); border-color: var(--accent); }\n.btn-primary:hover { background: var(--accent-ink); border-color: var(--accent-ink); }\n.btn-black { background: var(--udder-black); color: var(--udder-white); border-color: var(--udder-black); border-radius: var(--r-btn) !important; }\n\n/* Cards & surfaces — soft rounded, not square */\n.card, .stat-card, .audience-card, .kpi, .vtier, .onboard-form .card, .pcard,\n.modal, .lead-detail, .leads-list, .lead-item, .cmp-header-card,\n.filter-sidebar .filter-group, .note, .stakeholder, .hero-search,\n.vendor-list-item, .role-card, .chip-check, .pill, .tag, .internal-banner,\n.vbadge, .feature-cell, .tweaks-panel, .tweak-group,\n.topbar-search, .input, .select, .textarea,\n.filter-dropdown, .onboard-art, .tab, .pdetail-tab {\n  border-radius: var(--r-soft);\n}\n.card, .audience-card, .vtier, .pcard, .lead-detail, .modal, .onboard-art,\n.stat-card, .kpi { border-radius: var(--r-card); }\n.pill, .tag, .chip-check { border-radius: var(--r-btn); padding-left: 10px; padding-right: 10px; }\n.vbadge { border-radius: var(--r-btn); }\n\n/* Typography — Poppins needs slightly tighter tracking on display,\n   and the super-huge hero works better at -0.035em */\nh1, h2, h3, .h-page, .h-section, .sidebar-brand .wm, .sidebar-brand .db,\n.brand, .brand .db { letter-spacing: -0.025em !important; }\n.hero h1, .footer-cta h2 { letter-spacing: -0.035em !important; line-height: 0.98 !important; }\n.eyebrow { letter-spacing: 0.14em; font-weight: 700; color: var(--accent); font-family: var(--font-display); }\n\n/* Inputs — rounded + softer */\n.input, .select, .textarea { border-radius: var(--r-soft); }\n.topbar-search { border-radius: var(--r-btn); }\n.hero-search { border-radius: var(--r-btn); overflow: hidden; border: 2px solid var(--udder-black); background: var(--bg); }\n.hero-search button { border-radius: 0 var(--r-btn) var(--r-btn) 0 !important; }\n\n/* Accent-forward hover: buttons and nav hover pick up orange */\n.sidebar-nav a:hover { color: var(--accent); }\n.sidebar-nav a.active { color: var(--accent); border-left-color: var(--accent); }\n\n* { box-sizing: border-box; }\nhtml, body, #root { height: 100%; margin: 0; }\nbody {\n  font-family: var(--font-body);\n  color: var(--fg1);\n  background: var(--bg);\n  -webkit-font-smoothing: antialiased;\n  font-size: 14px;\n}\n\n/* Theme: light (default) / dark */\nbody[data-theme=\"dark\"] {\n  --bg: #0A0A0A;\n  --bg-alt: #141414;\n  --bg-inverse: #F3F3F3;\n  --fg1: #FAFAFA;\n  --fg2: #C7C7C7;\n  --fg3: #8F8F8F;\n  --fg-on-brand: #FFFFFF;\n  --border: #262626;\n  --border-strong: #FAFAFA;\n  --udder-white: #0A0A0A;\n  --udder-slate-100: #141414;\n  --udder-slate-200: #1F1F1F;\n  --udder-cream: #111111;\n}\n\nbutton { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }\na { color: inherit; text-decoration: none; }\ninput, select, textarea { font-family: inherit; font-size: inherit; color: inherit; }\n\n/* Density modifier */\nbody[data-density=\"compact\"] { --row-pad: 10px; --card-pad: 16px; }\nbody[data-density=\"comfortable\"] { --row-pad: 16px; --card-pad: 24px; }\n\n/* Scrollbar */\n::-webkit-scrollbar { width: 10px; height: 10px; }\n::-webkit-scrollbar-thumb { background: var(--border); border-radius: 0; }\n::-webkit-scrollbar-thumb:hover { background: var(--fg3); }\n::-webkit-scrollbar-track { background: transparent; }\n\n/* ======== App shell ======== */\n.app {\n  display: grid;\n  grid-template-columns: 240px 1fr;\n  height: 100vh;\n  overflow: hidden;\n}\n.app-signedout { display: block; height: 100vh; overflow: auto; }\n\n/* Sidebar */\n.sidebar {\n  background: var(--bg);\n  border-right: 1px solid var(--border);\n  display: flex;\n  flex-direction: column;\n  padding: 20px 0;\n  overflow-y: auto;\n}\n.sidebar-brand {\n  padding: 0 24px 24px 24px;\n  display: flex;\n  align-items: baseline;\n  gap: 6px;\n  border-bottom: 1px solid var(--border);\n}\n.sidebar-brand .wm {\n  font-family: var(--font-display);\n  font-weight: 900;\n  font-size: 24px;\n  letter-spacing: -0.04em;\n  color: var(--fg1);\n  text-transform: uppercase;\n}\n.sidebar-brand .db {\n  font-family: var(--font-display);\n  font-weight: 900;\n  font-size: 24px;\n  letter-spacing: -0.04em;\n  color: var(--accent);\n  text-transform: uppercase;\n}\n.sidebar-role {\n  padding: 14px 24px;\n  border-bottom: 1px solid var(--border);\n  display: flex;\n  align-items: center;\n  gap: 10px;\n  cursor: pointer;\n}\n.sidebar-role:hover { background: var(--bg-alt); }\n.sidebar-role .avatar {\n  width: 32px; height: 32px;\n  background: var(--udder-black);\n  color: var(--udder-white);\n  font-family: var(--font-display);\n  font-weight: 800;\n  font-size: 13px;\n  display: flex; align-items: center; justify-content: center;\n}\n.sidebar-role .name { font-weight: 600; font-size: 13px; }\n.sidebar-role .role { font-size: 11px; color: var(--fg3); text-transform: uppercase; letter-spacing: 0.08em; font-weight: 600; }\n\n.sidebar-section {\n  padding: 20px 24px 8px;\n  font-size: 11px;\n  font-weight: 700;\n  letter-spacing: 0.14em;\n  text-transform: uppercase;\n  color: var(--fg3);\n}\n.sidebar-nav { display: flex; flex-direction: column; }\n.sidebar-nav a {\n  padding: 9px 24px;\n  font-size: 13px;\n  font-weight: 500;\n  color: var(--fg2);\n  display: flex;\n  align-items: center;\n  gap: 10px;\n  border-left: 3px solid transparent;\n  cursor: pointer;\n  transition: background var(--dur-fast) var(--ease-out);\n}\n.sidebar-nav a:hover { background: var(--bg-alt); color: var(--fg1); }\n.sidebar-nav a.active {\n  color: var(--fg1);\n  background: var(--bg-alt);\n  border-left-color: var(--accent);\n  font-weight: 600;\n}\n.sidebar-nav a .count {\n  margin-left: auto;\n  font-size: 11px;\n  padding: 1px 6px;\n  background: var(--border);\n  color: var(--fg2);\n  font-weight: 600;\n}\n.sidebar-nav a.active .count { background: var(--accent); color: var(--fg-on-brand); }\n\n.sidebar-footer {\n  margin-top: auto;\n  padding: 16px 24px;\n  border-top: 1px solid var(--border);\n  font-size: 11px;\n  color: var(--fg3);\n}\n\n/* Main */\n.main {\n  display: flex;\n  flex-direction: column;\n  overflow: hidden;\n  background: var(--bg);\n}\n.topbar {\n  height: 56px;\n  border-bottom: 1px solid var(--border);\n  display: flex;\n  align-items: center;\n  padding: 0 24px;\n  gap: 16px;\n  background: var(--bg);\n  flex-shrink: 0;\n}\n.topbar .crumbs {\n  font-size: 13px;\n  color: var(--fg3);\n  display: flex;\n  align-items: center;\n  gap: 8px;\n}\n.topbar .crumbs .sep { color: var(--fg3); }\n.topbar .crumbs .current { color: var(--fg1); font-weight: 600; }\n.topbar-search {\n  flex: 1;\n  max-width: 480px;\n  display: flex;\n  align-items: center;\n  gap: 8px;\n  padding: 7px 12px;\n  background: var(--bg-alt);\n  border: 1px solid var(--border);\n}\n.topbar-search input { flex: 1; background: none; border: none; outline: none; font-size: 13px; }\n.topbar-spacer { flex: 1; }\n.topbar-action {\n  padding: 8px 12px;\n  font-size: 13px;\n  font-weight: 600;\n  border: 1px solid var(--border);\n  display: flex; align-items: center; gap: 6px;\n}\n.topbar-action:hover { background: var(--bg-alt); }\n.topbar-action.primary {\n  background: var(--accent);\n  color: var(--fg-on-brand);\n  border-color: var(--accent);\n}\n.topbar-action.primary:hover { background: var(--accent-ink); border-color: var(--accent-ink); }\n\n.content {\n  flex: 1;\n  overflow: auto;\n  padding: 32px 40px;\n}\n\n/* ======== Typography helpers ======== */\n.h-page {\n  font-family: var(--font-display);\n  font-weight: 800;\n  font-size: 32px;\n  letter-spacing: -0.02em;\n  line-height: 1.05;\n  margin: 0;\n}\n.h-section {\n  font-family: var(--font-display);\n  font-weight: 700;\n  font-size: 20px;\n  letter-spacing: -0.01em;\n  margin: 0;\n}\n.eyebrow {\n  font-family: var(--font-display);\n  font-weight: 700;\n  font-size: 11px;\n  letter-spacing: 0.18em;\n  text-transform: uppercase;\n  color: var(--accent);\n}\n.muted { color: var(--fg3); }\n\n/* ======== Buttons ======== */\n.btn {\n  display: inline-flex;\n  align-items: center;\n  justify-content: center;\n  gap: 8px;\n  padding: 10px 16px;\n  font-size: 13px;\n  font-weight: 600;\n  border: 1px solid var(--border);\n  background: var(--bg);\n  color: var(--fg1);\n  transition: all var(--dur-fast) var(--ease-out);\n  white-space: nowrap;\n}\n.btn:hover { background: var(--bg-alt); }\n.btn-primary {\n  background: var(--accent);\n  color: var(--fg-on-brand);\n  border-color: var(--accent);\n}\n.btn-primary:hover { background: var(--accent-ink); border-color: var(--accent-ink); }\n.btn-black {\n  background: var(--udder-black);\n  color: var(--udder-white);\n  border-color: var(--udder-black);\n}\nbody[data-theme=\"dark\"] .btn-black {\n  background: var(--fg1);\n  color: var(--bg);\n  border-color: var(--fg1);\n}\n.btn-ghost { border-color: transparent; }\n.btn-sm { padding: 6px 10px; font-size: 12px; }\n.btn-lg { padding: 14px 22px; font-size: 14px; }\n\n/* ======== Verification badges ======== */\n.vbadge {\n  display: inline-flex;\n  align-items: center;\n  gap: 6px;\n  font-family: var(--font-display);\n  font-weight: 700;\n  font-size: 10px;\n  letter-spacing: 0.1em;\n  text-transform: uppercase;\n  padding: 4px 8px;\n  border: 1px solid;\n  white-space: nowrap;\n}\n.vbadge .dot {\n  width: 6px; height: 6px; border-radius: 50%;\n  background: currentColor;\n}\n.vbadge-ai { color: var(--fg3); border-color: var(--border); background: transparent; }\n.vbadge-vendor { color: var(--udder-slate-700); border-color: var(--udder-slate-700); background: var(--bg); }\nbody[data-theme=\"dark\"] .vbadge-vendor { color: #C7C7C7; border-color: #5a5a5a; }\n.vbadge-verified { color: var(--fg-on-brand); background: var(--accent); border-color: var(--accent); }\n.vbadge-approved {\n  color: var(--udder-white);\n  background: var(--udder-black);\n  border-color: var(--udder-black);\n}\nbody[data-theme=\"dark\"] .vbadge-approved { background: var(--fg1); color: var(--bg); border-color: var(--fg1); }\n\n/* style variants */\n.vbadge-style-pill { border-radius: 999px; }\n.vbadge-style-solid { /* default */ }\n.vbadge-style-minimal {\n  border: none;\n  padding: 2px 0;\n  background: transparent !important;\n  color: inherit !important;\n}\n.vbadge-style-minimal .dot { background: currentColor; }\n.vbadge-style-minimal.vbadge-ai .dot { background: var(--fg3); }\n.vbadge-style-minimal.vbadge-vendor .dot { background: var(--udder-slate-700); }\n.vbadge-style-minimal.vbadge-verified .dot { background: var(--accent); }\n.vbadge-style-minimal.vbadge-approved .dot { background: var(--udder-black); }\nbody[data-theme=\"dark\"] .vbadge-style-minimal.vbadge-approved .dot { background: var(--fg1); }\n\n/* ======== Pills & tags ======== */\n.pill {\n  display: inline-flex;\n  align-items: center;\n  gap: 5px;\n  padding: 3px 10px;\n  border-radius: 999px;\n  font-size: 11px;\n  font-weight: 600;\n  background: var(--bg-alt);\n  color: var(--fg2);\n  border: 1px solid var(--border);\n}\n.pill-solid { background: var(--udder-black); color: var(--udder-white); border-color: var(--udder-black); }\n.tag {\n  display: inline-flex;\n  padding: 3px 8px;\n  font-size: 11px;\n  font-weight: 500;\n  background: var(--bg-alt);\n  color: var(--fg2);\n  border: 1px solid var(--border);\n}\n\n/* ======== Cards ======== */\n.card {\n  background: var(--bg);\n  border: 1px solid var(--border);\n  padding: var(--card-pad, 24px);\n}\n.card-flush { padding: 0; }\n\n/* Product card */\n.pcard {\n  background: var(--bg);\n  border: 1px solid var(--border);\n  display: flex;\n  flex-direction: column;\n  transition: border-color var(--dur-fast), transform var(--dur-fast);\n  cursor: pointer;\n}\n.pcard:hover { border-color: var(--fg1); }\n.pcard-header {\n  padding: var(--card-pad, 20px);\n  display: flex;\n  align-items: flex-start;\n  gap: 12px;\n  border-bottom: 1px solid var(--border);\n}\n.pcard-logo {\n  width: 48px; height: 48px;\n  display: flex; align-items: center; justify-content: center;\n  background: var(--bg-alt);\n  font-family: var(--font-display);\n  font-weight: 800;\n  font-size: 18px;\n  color: var(--fg1);\n  flex-shrink: 0;\n}\n.pcard-title { font-weight: 700; font-size: 16px; margin: 0 0 2px; font-family: var(--font-display); letter-spacing: -0.01em; }\n.pcard-vendor { font-size: 12px; color: var(--fg3); }\n.pcard-body {\n  padding: var(--card-pad, 20px);\n  display: flex; flex-direction: column; gap: 12px;\n  flex: 1;\n}\n.pcard-desc {\n  font-size: 13px;\n  color: var(--fg2);\n  line-height: 1.5;\n  display: -webkit-box;\n  -webkit-line-clamp: 3;\n  -webkit-box-orient: vertical;\n  overflow: hidden;\n}\n.pcard-cats { display: flex; flex-wrap: wrap; gap: 4px; }\n.pcard-meta {\n  display: flex; gap: 16px;\n  font-size: 11px; color: var(--fg3);\n  padding-top: 8px; margin-top: auto;\n  border-top: 1px solid var(--border);\n}\n.pcard-meta .k { font-weight: 600; color: var(--fg2); }\n.pcard-footer {\n  padding: var(--card-pad, 20px);\n  border-top: 1px solid var(--border);\n  display: flex; justify-content: space-between; align-items: center;\n}\n\n/* Compact mode for cards */\nbody[data-density=\"compact\"] .pcard-desc { -webkit-line-clamp: 2; font-size: 12px; }\nbody[data-density=\"compact\"] .pcard-title { font-size: 14px; }\nbody[data-density=\"compact\"] .pcard-logo { w margin-bottom: 12px;\n  font-size: 13px;\n  line-height: 1.5;\n}\n.note .meta { font-size: 11px; color: var(--fg3); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.06em; font-weight: 600; }\n\n.stakeholder {\n  padding: 12px 16px;\n  border: 1px solid var(--border);\n  display: grid;\n  grid-template-columns: auto 1fr auto;\n  gap: 12px;\n  align-items: center;\n  margin-bottom: 8px;\n}\n.stakeholder .avatar {\n  width: 36px; height: 36px;\n  background: var(--udder-black);\n  color: var(--udder-white);\n  display: flex; align-items: center; justify-content: center;\n  font-family: var(--font-display); font-weight: 800; font-size: 13px;\n}\n.stakeholder .n { font-weight: 700; font-size: 13px; }\n.stakeholder .r { font-size: 11px; color: var(--fg3); }\n\n/* Advocacy indicator */\n.advocacy { display: flex; gap: 3px; }\n.advocacy .seg { width: 18px; height: 6px; background: var(--border); }\n.advocacy .seg.on { background: var(--accent); }\n\n/* ======== Admin ======== */\n.kpi-row { display: grid; grid-template-columns: repeat(6, 1fr); gap: 0; border: 1px solid var(--border); margin-bottom: 24px; }\n.kpi { padding: 18px 20px; border-right: 1px solid var(--border); }\n.kpi:last-child { border-right: none; }\n.kpi .l { font-size: 10px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--fg3); font-weight: 700; margin-bottom: 6px; }\n.kpi .v { font-family: var(--font-display); font-weight: 900; font-size: 26px; letter-spacing: -0.02em; }\n.kpi .d { font-size: 11px; margin-top: 4px; font-weight: 600; }\n.kpi .d.up { color: var(--udder-green); }\n.kpi .d.down { color: var(--udder-red); }\n\n/* ======== Tweaks panel ======== */\n.tweaks-panel {\n  position: fixed;\n  right: 20px;\n  bottom: 20px;\n  width: 280px;\n  background: var(--bg);\n  border: 2px solid var(--fg1);\n  padding: 0;\n  z-index: 100;\n  font-family: var(--font-body);\n  box-shadow: 0 12px 32px rgba(0,0,0,.2);\n}\n.tweaks-head {\n  padding: 12px 16px;\n  background: var(--fg1);\n  color: var(--bg);\n  font-family: var(--font-display);\n  font-weight: 800;\n  font-size: 14px;\n  letter-spacing: 0.08em;\n  text-transform: uppercase;\n  display: flex;\n  justify-content: space-between;\n  align-items: center;\n}\n.tweaks-body { padding: 16px; display: flex; flex-direction: column; gap: 16px; max-height: 70vh; overflow-y: auto; }\n.tweak-group { display: flex; flex-direction: column; gap: 8px; }\n.tweak-group label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--fg3); }\n.tweak-options { display: flex; gap: 4px; border: 1px solid var(--border); }\n.tweak-options button {\n  flex: 1;\n  padding: 8px 10px;\n  font-size: 11px;\n  font-weight: 600;\n  background: var(--bg);\n  color: var(--fg2);\n  border-right: 1px solid var(--border);\n}\n.tweak-options button:last-child { border-right: none; }\n.tweak-options button.active { background: var(--fg1); color: var(--bg); }\n.tweak-options button:hover:not(.active) { background: var(--bg-alt); color: var(--fg1); }\n\n/* Icon helpers (inline SVG size) */\n.icon { width: 16px; height: 16px; flex-shrink: 0; }\n.icon-sm { width: 12px; height: 12px; }\n.icon-lg { width: 20px; height: 20px; }\n\n/* Misc */\n.divider { height: 1px; background: var(--border); margin: 24px 0; }\nhr { border: none; border-top: 1px solid var(--border); margin: 24px 0; }\n.empty { padding: 48px; text-align: center; color: var(--fg3); font-size: 14px; }\n\n/* ======== Form styles inputs ======== */\n.input, .select, .textarea {\n  padding: 10px 12px;\n  border: 1px solid var(--border);\n  background: var(--bg);\n  font-size: 13px;\n  outline: none;\n  width: 100%;\n  color: var(--fg1);\n}\n.input:focus, .select:focus, .textarea:focus { border-color: var(--accent); }\n\n/* ======== Chip checkbox ======== */\n.chip-check {\n  padding: 8px 14px;\n  border: 1px solid var(--border);\n  font-size: 12px;\n  font-weight: 500;\n  cursor: pointer;\n  user-select: none;\n  background: var(--bg);\n}\n.chip-check.on { background: var(--fg1); color: var(--bg); border-color: var(--fg1); }\n\n/* Data visualisation placeholder */\n.sparkline { display: flex; align-items: flex-end; gap: 2px; height: 24px; }\n.sparkline .b { width: 4px; background: var(--accent); }\n\n/* ======== Utilities ======== */\n.row { display: flex; align-items: center; gap: 10px; }\n.col { display: flex; flex-direction: column; gap: 10px; }\n.space-between { justify-content: space-between; }\n.mb-4 { margin-bottom: 16px; }\n.mb-6 { margin-bottom: 24px; }\n.mb-8 { margin-bottom: 32px; }\n.mt-4 { margin-top: 16px; }\n.gap-1 { gap: 4px; } .gap-2 { gap: 8px; } .gap-3 { gap: 12px; } .gap-4 { gap: 16px; } .gap-5 { gap: 24px; }\n.flex-1 { flex: 1; }\n.text-xs { font-size: 11px; } .text-sm { font-size: 12px; } .text-md { font-size: 13px; } .text-lg { font-size: 16px; }\n.w-full { width: 100%; }\n<\u002Fstyle>\n\n<script src=\"20a8e977-a260-4133-9545-2ed3c2140bce\" integrity=\"sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L\" crossorigin=\"anonymous\"><\u002Fscript>\n<script src=\"edfd33b0-d2fa-48fc-b217-86b02e895069\" integrity=\"sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm\" crossorigin=\"anonymous\"><\u002Fscript>\n<script src=\"990c0cf6-132a-4891-9943-0061df6b3d32\" integrity=\"sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y\" crossorigin=\"anonymous\"><\u002Fscript>\n<\u002Fhead>\n<body>\n\n<div id=\"root\"><\u002Fdiv>\n\n<script type=\"text/babel\" src=\"86fcec6f-362d-4e48-abc5-19209708012e\"><\u002Fscript>\n<script type=\"text/babel\" src=\"0389a9e9-fb41-490f-b97e-b50d2e0d5b10\"><\u002Fscript>\n<script type=\"text/babel\" src=\"a074dadb-660c-4a6e-9c9e-739507351aac\"><\u002Fscript>\n<script type=\"text/babel\" src=\"4a7c2f58-9b32-4339-b577-e2757dd2313f\"><\u002Fscript>\n<script type=\"text/babel\" src=\"38697d50-4f05-43ca-8b21-749bfa69b7b3\"><\u002Fscript>\n<script type=\"text/babel\" src=\"2249bb20-c159-4d8a-9998-153bf4603382\"><\u002Fscript>\n\n<script type=\"text/babel\" data-presets=\"env,react\">\nconst TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{\n  \"theme\": \"light\",\n  \"density\": \"compact\",\n  \"searchLayout\": \"sidebar\",\n  \"badgeStyle\": \"pill\",\n  \"detailLayout\": \"standard\"\n}/*EDITMODE-END*/;\n\nconst App = () => {\n  const [page, setPageState] = React.useState(() => localStorage.getItem('udderdb:page') || 'landing');\n  const [role, setRoleState] = React.useState(() => localStorage.getItem('udderdb:role') || 'hr');\n  const [selectedProduct, setSelectedProduct] = React.useState('smartrecruiters');\n  const [compareIds, setCompareIds] = React.useState(['smartrecruiters','avature','greenhouse']);\n  const [tweaks, setTweaks] = React.useState(TWEAK_DEFAULTS);\n  const [tweaksOpen, setTweaksOpen] = React.useState(false);\n  const [introOpen, setIntroOpen] = React.useState(false);\n  const [editModeActive, setEditModeActive] = React.useState(false);\n\n  const setPage = (p) => { setPageState(p); localStorage.setItem('udderdb:page', p); window.scrollTo(0, 0); };\n  const setRole = (r) => { setRoleState(r); localStorage.setItem('udderdb:role', r); };\n  const setTweak = (k, v) => {\n    setTweaks(prev => {\n      const next = { ...prev, [k]: v };\n      window.parent.postMessage({ type: '__edit_mode_set_keys', edits: { [k]: v } }, '*');\n      return next;\n    });\n  };\n\n  // Apply theme to body\n  React.useEffect(() => {\n    document.documentElement.dataset.theme = tweaks.theme;\n    document.documentElement.dataset.density = tweaks.density;\n  }, [tweaks.theme, tweaks.density]);\n\n  // Edit mode messaging\n  React.useEffect(() => {\n    const handler = (e) => {\n      if (!e.data || typeof e.data !== 'object') return;\n      if (e.data.type === '__activate_edit_mode') { setEditModeActive(true); setTweaksOpen(true); }\n      if (e.data.type === '__deactivate_edit_mode') { setEditModeActive(false); setTweaksOpen(false); }\n    };\n    window.addEventListener('message', handler);\n    window.parent.postMessage({ type: '__edit_mode_available' }, '*');\n    return () => window.removeEventListener('message', handler);\n  }, []);\n\n  const ctx = {\n    page, setPage, role, setRole,\n    selectedProduct, setSelectedProduct,\n    compareIds, setCompareIds,\n    tweaks, setTweak, setTweaks,\n    tweaksOpen, setTweaksOpen,\n    introOpen, setIntroOpen,\n  };\n\n  // Add data-screen-label for comment context\n  const labels = {\n    'landing': '01 Landing',\n    'onboarding': '02 Onboarding',\n    'search': '03 Search & Discovery',\n    'product-detail': '04 Product Detail',\n    'compare': '05 Compare',\n    'vendor-listing': '06 Vendor Listing',\n    'vendor-leads': '07 Vendor Leads',\n    'consultant': '08 Consultant Knowledge',\n    'admin': '09 Admin Dashboard',\n  };\n\n  const screen = (() => {\n    switch (page) {\n      case 'landing': return <LandingPage/>;\n      case 'onboarding': return <OnboardingPage/>;\n      case 'search': return <SearchPage/>;\n      case 'product-detail': return <ProductDetailPage/>;\n      case 'compare': return <ComparePage/>;\n      case 'vendor-listing': return <VendorListingPage/>;\n      case 'vendor-leads': return <VendorLeadsPage/>;\n      case 'consultant': return <ConsultantPage/>;\n      case 'admin': return <AdminPage/>;\n      default: return <LandingPage/>;\n    }\n  })();\n\n  const isSignedOut = page === 'landing' || page === 'onboarding';\n\n  return (\n    <AppContext.Provider value={ctx}>\n      <div data-screen-label={labels[page] || page}>\n        {isSignedOut ? screen : <Shell>{screen}<\u002FShell>}\n      <\u002Fdiv>\n      <IntroModal/>\n      <TweaksPanel/>\n    <\u002FAppContext.Provider>\n  );\n};\n\nReactDOM.createRoot(document.getElementById('root')).render(<App/>);\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
