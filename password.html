<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Udder Database - New Password</title>
  <link rel="stylesheet" href="assets/css/styles.css" />
  <link rel="stylesheet" href="assets/css/login.css" />
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script type="module" src="assets/js/core/auth/password.js"></script>
  <style>
    .login-box button {
      background: #000 !important;
      color: white !important;
  }
  </style>
</head>
<body>
  <div class="screen">
    <div class="brand">
      <div class="float-left">
          <a href="./" style="text-decoration: none;"><span style="font-size: 30px;color: var(--black);"><strong>UDDER</strong></span><br/><span style="color: grey;font-size: 21px;">DATABASE</span></a>
        </div>
    </div>

    <div class="cow-icon">
        <img src="assets/images/cow.png" alt="Cow illustration">
    </div>

    <div class="login-box">
        <span style="margin-bottom: 10px;">Please enter your new password below:</span>
        <label for="password">Password *</label>
      <input type="password" name="password" id="newPassword" placeholder="should be at least 8 characters long">
      <button class="cta" type="button" id="savePassBtn">Save</button>
      <a class="cta" href="login.html" style="background: white;color: black;border: 1px solid var(--border);">Login</a>
    </div>
  </div>
</body>
</html>
