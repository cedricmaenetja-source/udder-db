<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Udder Database Sign Up</title>
  <link rel="stylesheet" href="assets/css/styles.css" />
  <link rel="stylesheet" href="assets/css/login.css" />
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script type="module" src="assets/js/core/auth/signUp.js"></script>
</head>
<body>
  <div class="screen">
    <div class="brand">
      <div class="float-left">
          <a href="./" style="text-decoration: none;"><span style="font-size: 30px;color: var(--black);"><strong>UDDER</strong></span><br/><span style="color: grey;font-size: 21px;">DATABASE</span></a>
        </div>
    </div>

    <div class="cow-icon">
        <img src="assets/images/cow.png" alt="Cow illustration">
    </div>

    <div class="login-box">
        <label for="fname">First Name *</label>
        <input type="text" name="fname" id="fname">
        <label for="lname">Last Name *</label>
        <input type="text" name="lname" id="lname">
        <label for="email">Email *</label>
      <input type="email" name="email" id="email">
      <label for="password">Password (min. 8 characters long) *</label>
      <input type="password" name="pwd" id="pwd">
      <label for="role">Role</label>
      <select id="role">
        <option value="hr-professional">HR Professional</option>
        <option value="vendor">Vendor</option>
      </select>
      <div class="privacy-policy">
        <span>By clicking Agree & Sign Up, you agree to the Udder's <a href="https://udder.rocks/privacy-policy" target="_blank">Privary Policy</a>.</span>
      </div>
      <a href="javascript:void(0)" id="signUp" class="cta">Agree & Sign Up</a>
      <span style="color: var(--grey);font-size: 12px;margin-top: 20px;">
        Already have an account?
        <a href="login.html" class="">Login</a>
      </span>
    </div>
  </div>
</body>
</html>
